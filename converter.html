<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      min-height: 100vh;
    }
    /* ----- Header ----- */
    .header {
      height: 64px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 20px;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .brand-icon {
      background: #4f46e5;
      color: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 18px;
    }
    .nav {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }
    .nav button {
      border: none;
      background: transparent;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.2s;
    }
    .nav button:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    .nav button.active {
      background: #eef2ff;
      color: #4f46e5;
    }

    /* ----- Main content ----- */
    .wrap {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .hero {
      text-align: center;
      margin-bottom: 24px;
    }
    .hero h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .hero p {
      color: #64748b;
      font-size: 16px;
    }

    .converter-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
      padding: 24px;
    }

    /* Conversion tabs (pill style) */
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 16px;
      margin-bottom: 22px;
    }
    .tab {
      padding: 8px 16px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      border-radius: 999px;
      font-weight: 600;
      font-size: 13px;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .tab:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    .tab.active {
      background: #4f46e5;
      border-color: #4f46e5;
      color: #ffffff;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
      background: #fafbfc;
      transition: all 0.25s;
      cursor: pointer;
    }
    .drop-zone.drag-over {
      border-color: #4f46e5;
      background: #eef2ff;
    }
    .drop-zone .icon {
      font-size: 40px;
      display: block;
      margin-bottom: 8px;
    }
    .drop-zone h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .drop-zone p {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 14px;
    }
    .drop-zone .choose {
      display: inline-flex;
      background: #4f46e5;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
      border: none;
    }
    .drop-zone .choose:hover {
      background: #4338ca;
    }
    .drop-zone input[type="file"] {
      display: none;
    }

    /* File list */
    .files {
      margin-top: 16px;
      display: grid;
      gap: 8px;
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
    }
    .file-item .name {
      font-weight: 500;
      color: #0f172a;
    }
    .file-item .size {
      color: #64748b;
      font-size: 13px;
    }

    /* Actions */
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }
    .convert-btn {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }
    .convert-btn:hover {
      background: #4338ca;
    }
    .convert-btn:disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    /* Status */
    .status {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      background: #f8fafc;
      color: #475569;
      font-size: 14px;
      display: none;
    }
    .status.show { display: block; }
    .status.error {
      background: #fef2f2;
      color: #b91c1c;
    }
    .status.ok {
      background: #f0fdf4;
      color: #166534;
    }

    .note {
      margin-top: 16px;
      color: #94a3b8;
      font-size: 13px;
      border-top: 1px solid #e2e8f0;
      padding-top: 14px;
    }
    .cap {
      display: inline-block;
      margin: 4px 4px 0 0;
      padding: 4px 10px;
      background: #f1f5f9;
      border-radius: 999px;
      font-size: 12px;
      color: #475569;
    }

    /* Responsive */
    @media (max-width: 700px) {
      .header { padding: 0 12px; gap: 12px; flex-wrap: wrap; }
      .nav { margin-left: 0; width: 100%; justify-content: flex-start; overflow-x: auto; }
      .wrap { margin-top: 16px; padding: 0 12px; }
      .converter-card { padding: 16px; }
      .tabs { gap: 4px; }
      .tab { font-size: 12px; padding: 6px 12px; }
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <span class="brand-icon">▣</span> Document Converter
    </div>
    <nav class="nav">
      <button class="active" data-nav="converter">Converter</button>
      <button onclick="if(window.parent!==window){window.parent.postMessage('show-editor','*')}else{window.close()}">
        ⬅ Back to Editor
      </button>
    </nav>
  </header>

  <!-- MAIN -->
  <div class="wrap">
    <div class="hero">
      <h1>Convert your documents</h1>
      <p>Choose a conversion, upload your file, and download the result.</p>
    </div>

    <section class="converter-card">
      <div class="tabs" id="tabsContainer">
        <button class="tab active" data-conversion="word-to-pdf">Word → PDF</button>
        <button class="tab" data-conversion="pdf-to-word">PDF → Word</button>
        <button class="tab" data-conversion="excel-to-pdf">Excel → PDF</button>
        <button class="tab" data-conversion="powerpoint-to-pdf">PowerPoint → PDF</button>
        <button class="tab" data-conversion="images-to-pdf">Images → PDF</button>
        <button class="tab" data-conversion="pdf-to-images">PDF → Images</button>
        <button class="tab" data-conversion="merge-pdf">Merge PDFs</button>
      </div>

      <div id="panel" class="panel active">
        <!-- Drop zone -->
        <div class="drop-zone" id="drop">
          <div>
            <span class="icon">📤</span>
            <h3 id="dropTitle">Upload a Word document</h3>
            <p id="dropHint">DOC, DOCX or ODT • up to 50 MB</p>
            <label class="choose">Choose file <input id="files" type="file"></label>
          </div>
        </div>

        <!-- File list -->
        <div class="files" id="fileList"></div>

        <!-- Actions -->
        <div class="actions">
          <button class="convert-btn" id="convertBtn" disabled>Convert to PDF</button>
        </div>

        <!-- Status -->
        <div class="status" id="status"></div>

        <!-- Note -->
        <div class="note" id="note">
          Word, Excel and PowerPoint conversion uses LibreOffice on the local machine.
          <span class="cap">📦 pdf2docx</span>
          <span class="cap">📄 PyMuPDF</span>
        </div>
      </div>
    </section>
  </div>

  <script>
    // ========== ALL LOGIC UNCHANGED ==========
    let conversion = 'word-to-pdf', selectedFiles = [];
    const $ = id => document.getElementById(id);
    const specs = {
      'word-to-pdf': { title: 'Upload a Word document', hint: 'DOC, DOCX or ODT • up to 50 MB', accept: '.doc,.docx,.odt', multiple: false, button: 'Convert to PDF' },
      'pdf-to-word': { title: 'Upload a PDF', hint: 'One PDF • text will be extracted into a Word document', accept: '.pdf', multiple: false, button: 'Convert to Word' },
      'excel-to-pdf': { title: 'Upload an Excel workbook', hint: 'XLS, XLSX or ODS • up to 50 MB', accept: '.xls,.xlsx,.ods', multiple: false, button: 'Convert to PDF' },
      'powerpoint-to-pdf': { title: 'Upload a PowerPoint presentation', hint: 'PPT, PPTX or ODP • up to 50 MB', accept: '.ppt,.pptx,.odp', multiple: false, button: 'Convert to PDF' },
      'images-to-pdf': { title: 'Upload images', hint: 'PNG, JPG, JPEG or WebP • multiple files allowed', accept: '.png,.jpg,.jpeg,.webp', multiple: true, button: 'Create PDF' },
      'pdf-to-images': { title: 'Upload a PDF', hint: 'One PDF • pages are exported as PNG images (ZIP archive)', accept: '.pdf', multiple: false, button: 'Convert to Images' },
      'merge-pdf': { title: 'Upload PDFs to merge', hint: 'Select two or more PDF files', accept: '.pdf', multiple: true, button: 'Merge PDFs' }
    };

    function setStatus(text, type = '') {
      const s = $('status');
      s.textContent = text;
      s.className = 'status show ' + type;
    }

    function renderFiles() {
      const list = $('fileList');
      list.innerHTML = '';
      selectedFiles.forEach(f => {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `
          <span class="name">${escapeHtml(f.name)}</span>
          <span class="size">${(f.size / 1024 / 1024).toFixed(2)} MB</span>
        `;
        list.appendChild(div);
      });
      $('convertBtn').disabled = selectedFiles.length === 0;
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function configure() {
      const s = specs[conversion];
      $('dropTitle').textContent = s.title;
      $('dropHint').textContent = s.hint;
      $('files').accept = s.accept;
      $('files').multiple = s.multiple;
      $('convertBtn').textContent = s.button;
      selectedFiles = [];
      renderFiles();
      setStatus('');
    }

    // Tab switching
    document.querySelectorAll('.tab').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        conversion = b.dataset.conversion;
        configure();
      });
    });

    // File input
    $('files').addEventListener('change', e => {
      selectedFiles = [...e.target.files];
      renderFiles();
    });

    // Drag & drop
    const drop = $('drop');
    drop.addEventListener('dragover', e => {
      e.preventDefault();
      drop.classList.add('drag-over');
    });
    drop.addEventListener('dragleave', () => {
      drop.classList.remove('drag-over');
    });
    drop.addEventListener('drop', e => {
      e.preventDefault();
      drop.classList.remove('drag-over');
      selectedFiles = [...e.dataTransfer.files];
      renderFiles();
    });

    // Convert button
    $('convertBtn').addEventListener('click', async () => {
      const s = specs[conversion];
      if (!selectedFiles.length) return;
      if (conversion === 'merge-pdf' && selectedFiles.length < 2) {
        setStatus('Select at least two PDFs.', 'error');
        return;
      }
      const form = new FormData();
      form.append('conversion', conversion);
      selectedFiles.forEach(f => form.append('files', f));

      const btn = $('convertBtn');
      btn.disabled = true;
      setStatus('Converting…');

      try {
        const res = await fetch('/api/convert', { method: 'POST', body: form });
        if (!res.ok) {
          let msg = 'Conversion failed.';
          try { msg = (await res.json()).error || msg; } catch {}
          throw new Error(msg);
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        let filename = 'converted';
        if (conversion === 'pdf-to-images') filename = 'images.zip';
        else if (conversion === 'pdf-to-word') filename = 'converted.docx';
        else if (conversion === 'merge-pdf') filename = 'merged.pdf';
        else filename = 'converted.pdf';
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
        setStatus('Conversion completed. Download started.', 'ok');
      } catch (err) {
        setStatus(err.message, 'error');
      } finally {
        btn.disabled = false;
        renderFiles();
      }
    });

    // Initial setup
    configure();
  </script>
</body>
</html>
