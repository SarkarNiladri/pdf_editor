<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
  <title>Document Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
    }
    .header {
      height: 64px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 20px;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .brand-icon {
      background: #4f46e5;
      color: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 18px;
    }
    .nav {
      display: flex;
      gap: 4px;
      margin-left: auto;
      align-items: center;
    }
    .nav button {
      border: none;
      background: transparent;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .nav button:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    .nav button.active {
      background: #eef2ff;
      color: #4f46e5;
    }

    .wrap {
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 20px 16px;
    }
    .hero {
      text-align: center;
      margin-bottom: 20px;
    }
    .hero h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .hero p {
      color: #64748b;
      font-size: 15px;
    }

    .converter-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
      padding: 20px 16px;
      width: 100%;
    }

    .tabs-wrapper {
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 18px;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      width: 100%;
    }
    .tabs-wrapper::-webkit-scrollbar {
      height: 6px;
    }
    .tabs-wrapper::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }
    .tabs {
      display: flex !important;
      flex-wrap: nowrap !important;
      gap: 6px;
      width: max-content !important;
      min-width: 100% !important;
      padding-bottom: 4px;
    }
    .tab {
      padding: 6px 14px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      border-radius: 999px;
      font-weight: 600;
      font-size: 13px;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
      flex-shrink: 0 !important;
    }
    .tab:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    .tab.active {
      background: #4f46e5;
      border-color: #4f46e5;
      color: #ffffff;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .drop-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 16px;
      background: #fafbfc;
      transition: all 0.25s;
      cursor: pointer;
    }
    .drop-zone.drag-over {
      border-color: #4f46e5;
      background: #eef2ff;
    }
    .drop-zone .icon {
      font-size: 36px;
      display: block;
      margin-bottom: 6px;
    }
    .drop-zone h3 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .drop-zone p {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .drop-zone .choose {
      display: inline-flex;
      background: #4f46e5;
      color: #fff;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
      border: none;
    }
    .drop-zone .choose:hover {
      background: #4338ca;
    }
    .drop-zone input[type="file"] {
      display: none;
    }

    .format-selector {
      margin-top: 12px;
      display: none;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 14px;
      background: #f8fafc;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .format-selector.visible {
      display: flex;
    }
    .format-selector label {
      font-weight: 600;
      font-size: 14px;
      color: #334155;
    }
    .format-selector select {
      padding: 6px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
    }
    .format-selector select:focus {
      outline: 2px solid #818cf8;
      border-color: transparent;
    }

    .files {
      margin-top: 14px;
      display: grid;
      gap: 6px;
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13px;
    }
    .file-item .name {
      font-weight: 500;
      color: #0f172a;
      word-break: break-word;
    }
    .file-item .size {
      color: #64748b;
      font-size: 12px;
      margin-left: 8px;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }
    .convert-btn {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }
    .convert-btn:hover {
      background: #4338ca;
    }
    .convert-btn:disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .status {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #f8fafc;
      color: #475569;
      font-size: 13px;
      display: none;
    }
    .status.show { display: block; }
    .status.error {
      background: #fef2f2;
      color: #b91c1c;
    }
    .status.ok {
      background: #f0fdf4;
      color: #166534;
    }

    .note {
      margin-top: 14px;
      color: #94a3b8;
      font-size: 12px;
      border-top: 1px solid #e2e8f0;
      padding-top: 12px;
    }
    .cap {
      display: inline-block;
      margin: 4px 4px 0 0;
      padding: 4px 10px;
      background: #f1f5f9;
      border-radius: 999px;
      font-size: 11px;
      color: #475569;
    }

    @media (max-width: 768px) {
      .header { padding: 0 12px; gap: 10px; flex-wrap: wrap; height: auto; min-height: 56px; }
      .brand { font-size: 18px; }
      .nav {
        margin-left: 0;
        width: 100%;
        justify-content: flex-start;
        overflow-x: auto;
        gap: 2px;
        flex-wrap: nowrap;
        padding-bottom: 4px;
        -webkit-overflow-scrolling: touch;
      }
      .nav button { font-size: 13px; padding: 6px 12px; }
      .wrap { padding: 12px 8px; }
      .hero h1 { font-size: 22px; }
      .hero p { font-size: 14px; }
      .converter-card { padding: 14px 12px; border-radius: 12px; }
      .tabs-wrapper { padding-bottom: 10px; margin-bottom: 14px; }
      .tab { font-size: 12px; padding: 5px 12px; }
      .drop-zone { min-height: 150px; padding: 16px; }
      .drop-zone .icon { font-size: 28px; }
      .drop-zone h3 { font-size: 15px; }
      .drop-zone p { font-size: 12px; }
      .drop-zone .choose { font-size: 12px; padding: 6px 14px; }
      .file-item { font-size: 12px; padding: 6px 10px; }
      .convert-btn { width: 100%; justify-content: center; padding: 10px 16px; font-size: 13px; }
      .actions { justify-content: stretch; }
      .note { font-size: 11px; }
      .format-selector { flex-direction: column; align-items: stretch; gap: 6px; }
    }
    @media (max-width: 480px) {
      .brand { font-size: 16px; }
      .brand-icon { font-size: 14px; padding: 4px 8px; }
      .hero h1 { font-size: 18px; }
      .tab { font-size: 11px; padding: 4px 10px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand"><span class="brand-icon">▣</span> Document Converter</div>
    <nav class="nav">
      <button class="active" data-nav="converter">Converter</button>
      <button onclick="if(window.parent!==window){window.parent.postMessage('show-editor','*')}else{window.close()}">⬅ Back to Editor</button>
    </nav>
  </header>

  <div class="wrap">
    <div class="hero"><h1>Convert your documents</h1><p>Choose a conversion, upload your file, and download the result.</p></div>

    <section class="converter-card">
      <div class="tabs-wrapper">
        <div class="tabs" id="tabsContainer">
          <button class="tab active" data-conversion="word-to-pdf">Word → PDF</button>
          <button class="tab" data-conversion="pdf-to-word">PDF → Word</button>
          <button class="tab" data-conversion="excel-to-pdf">Excel → PDF</button>
          <button class="tab" data-conversion="powerpoint-to-pdf">PowerPoint → PDF</button>
          <button class="tab" data-conversion="images-to-pdf">Images → PDF</button>
          <button class="tab" data-conversion="pdf-to-images">PDF → Images</button>
          <button class="tab" data-conversion="merge-pdf">Merge PDFs</button>
          <button class="tab" data-conversion="image-to-image">Image → Image</button>
        </div>
      </div>

      <div id="panel" class="panel active">
        <div class="drop-zone" id="drop">
          <div>
            <span class="icon">📤</span>
            <h3 id="dropTitle">Upload an image</h3>
            <p id="dropHint">PNG, JPG, JPEG, WebP, BMP, GIF or TIFF • up to 50 MB</p>
            <label class="choose">Choose file <input id="files" type="file"></label>
          </div>
        </div>

        <div class="format-selector" id="formatSelector">
          <label for="targetFormat">Convert to:</label>
          <select id="targetFormat">
            <option value="jpeg">JPEG</option>
            <option value="png">PNG</option>
            <option value="webp">WebP</option>
            <option value="bmp">BMP</option>
            <option value="gif">GIF</option>
            <option value="tiff">TIFF</option>
          </select>
        </div>

        <div class="files" id="fileList"></div>

        <div class="actions">
          <button class="convert-btn" id="convertBtn" disabled>Convert</button>
        </div>

        <div class="status" id="status"></div>

        <div class="note" id="note">
          <span class="cap">📄 PyMuPDF</span>
          <span class="cap">🖼️ Pillow</span>
          <span class="cap">📦 pdf2docx</span>
          <span class="cap">📑 LibreOffice</span>
        </div>
      </div>
    </section>
  </div>

  <script>
    let conversion = 'word-to-pdf', selectedFiles = [];
    const $ = id => document.getElementById(id);
    const specs = {
      'word-to-pdf': { title: 'Upload a Word document', hint: 'DOC, DOCX or ODT • up to 50 MB', accept: '.doc,.docx,.odt', multiple: false, button: 'Convert to PDF', showFormat: false },
      'pdf-to-word': { title: 'Upload a PDF', hint: 'One PDF • text will be extracted into a Word document', accept: '.pdf', multiple: false, button: 'Convert to Word', showFormat: false },
      'excel-to-pdf': { title: 'Upload an Excel workbook', hint: 'XLS, XLSX or ODS • up to 50 MB', accept: '.xls,.xlsx,.ods', multiple: false, button: 'Convert to PDF', showFormat: false },
      'powerpoint-to-pdf': { title: 'Upload a PowerPoint presentation', hint: 'PPT, PPTX or ODP • up to 50 MB', accept: '.ppt,.pptx,.odp', multiple: false, button: 'Convert to PDF', showFormat: false },
      'images-to-pdf': { title: 'Upload images', hint: 'PNG, JPG, JPEG or WebP • multiple files allowed', accept: '.png,.jpg,.jpeg,.webp', multiple: true, button: 'Create PDF', showFormat: false },
      'pdf-to-images': { title: 'Upload a PDF', hint: 'One PDF • pages are exported as PNG images (ZIP archive)', accept: '.pdf', multiple: false, button: 'Convert to Images', showFormat: false },
      'merge-pdf': { title: 'Upload PDFs to merge', hint: 'Select two or more PDF files', accept: '.pdf', multiple: true, button: 'Merge PDFs', showFormat: false },
      'image-to-image': { title: 'Upload an image', hint: 'PNG, JPG, JPEG, WebP, BMP, GIF or TIFF', accept: '.png,.jpg,.jpeg,.webp,.bmp,.gif,.tiff', multiple: false, button: 'Convert Image', showFormat: true }
    };

    function setStatus(text, type = '') {
      const s = $('status');
      s.textContent = text;
      s.className = 'status show ' + type;
    }

    function renderFiles() {
      const list = $('fileList');
      list.innerHTML = '';
      selectedFiles.forEach(f => {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `<span class="name">${escapeHtml(f.name)}</span><span class="size">${(f.size / 1024 / 1024).toFixed(2)} MB</span>`;
        list.appendChild(div);
      });
      $('convertBtn').disabled = selectedFiles.length === 0;
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    function configure() {
      const s = specs[conversion];
      $('dropTitle').textContent = s.title;
      $('dropHint').textContent = s.hint;
      $('files').accept = s.accept;
      $('files').multiple = s.multiple;
      $('convertBtn').textContent = s.button;
      const formatSel = $('formatSelector');
      if (s.showFormat) {
        formatSel.classList.add('visible');
      } else {
        formatSel.classList.remove('visible');
      }
      selectedFiles = [];
      renderFiles();
      setStatus('');
    }

    document.querySelectorAll('.tab').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        conversion = b.dataset.conversion;
        configure();
      });
    });

    $('files').addEventListener('change', e => {
      selectedFiles = [...e.target.files];
      renderFiles();
    });

    const drop = $('drop');
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag-over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
    drop.addEventListener('drop', e => {
      e.preventDefault();
      drop.classList.remove('drag-over');
      selectedFiles = [...e.dataTransfer.files];
      renderFiles();
    });

    $('convertBtn').addEventListener('click', async () => {
      const s = specs[conversion];
      if (!selectedFiles.length) return;
      if (conversion === 'merge-pdf' && selectedFiles.length < 2) {
        setStatus('Select at least two PDFs.', 'error');
        return;
      }
      const form = new FormData();
      form.append('conversion', conversion);
      selectedFiles.forEach(f => form.append('files', f));

      if (conversion === 'image-to-image') {
        const target = $('targetFormat').value;
        form.append('target_format', target);
      }

      const btn = $('convertBtn');
      btn.disabled = true;
      setStatus('Converting…');

      try {
        const res = await fetch('/api/convert', { method: 'POST', body: form });
        if (!res.ok) {
          let msg = 'Conversion failed.';
          try { msg = (await res.json()).error || msg; } catch {}
          throw new Error(msg);
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        let filename = 'converted';
        if (conversion === 'pdf-to-images') filename = 'images.zip';
        else if (conversion === 'pdf-to-word') filename = 'converted.docx';
        else if (conversion === 'merge-pdf') filename = 'merged.pdf';
        else if (conversion === 'image-to-image') {
          const ext = $('targetFormat').value;
          filename = `converted.${ext === 'jpeg' ? 'jpg' : ext}`;
        } else {
          filename = 'converted.pdf';
        }
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
        setStatus('Conversion completed. Download started.', 'ok');
      } catch (err) {
        setStatus(err.message, 'error');
      } finally {
        btn.disabled = false;
        renderFiles();
      }
    });

    configure();
  </script>
</body>
</html>
