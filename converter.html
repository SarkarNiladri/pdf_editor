<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Document Converter</title>
  <meta name="theme-color" content="#5b4cf0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PDF Suite">
  <meta name="application-name" content="PDF Suite">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <script src="/static/net.js"></script>
  <script src="/static/pwa.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #f1f5f9; color: #0f172a; min-height: 100vh; margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
    .header { height: 64px; background: #ffffff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; padding: 0 24px; gap: 20px; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .brand-icon { background: #4f46e5; color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 18px; }
    .nav { display: flex; gap: 4px; margin-left: auto; align-items: center; }
    .nav button { border: none; background: transparent; padding: 8px 16px; border-radius: 8px; font-weight: 600; color: #64748b; cursor: pointer; font-family: inherit; font-size: 14px; transition: all 0.2s; white-space: nowrap; }
    .nav button:hover { background: #f1f5f9; color: #0f172a; }

    .wrap { width: 100%; max-width: 100%; margin: 0; padding: 20px 16px; }
    .converter-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05); padding: 20px 16px; width: 100%; }
    .tabs-wrapper { border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 18px; overflow-x: auto !important; -webkit-overflow-scrolling: touch; scrollbar-width: thin; width: 100%; }
    .tabs-wrapper::-webkit-scrollbar { height: 6px; }
    .tabs-wrapper::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    .tabs { display: flex !important; flex-wrap: nowrap !important; gap: 6px; width: max-content !important; min-width: 100% !important; padding-bottom: 4px; }
    .tab { padding: 6px 14px; border: 1px solid #e2e8f0; background: #ffffff; border-radius: 999px; font-weight: 600; font-size: 13px; color: #475569; cursor: pointer; transition: all 0.2s; font-family: inherit; white-space: nowrap; flex-shrink: 0 !important; }
    .tab:hover { background: #f8fafc; border-color: #cbd5e1; }
    .tab.active { background: #4f46e5; border-color: #4f46e5; color: #fff; }

    .panel { display: none; }
    .panel.active { display: block; }
    /* Organizer tools use a two-column workspace: controls on the left, a large page viewer on the right. */
    .panel.active.organizer-layout { display:grid; grid-template-columns:minmax(260px, 320px) minmax(0, 1fr); grid-template-areas:
      'upload viewer'
      'options viewer'
      'pdfoptions viewer'
      'files viewer'
      'actions actions'
      'status status'; gap:14px 18px; align-items:start; }
    .organizer-layout #drop { grid-area:upload; min-height:170px; padding:18px 12px; }
    .organizer-layout #imageOptions { grid-area:options; margin-top:0; }
    .organizer-layout #pdfOptions { grid-area:pdfoptions; margin-top:0; }
    .organizer-layout #fileList { grid-area:files; margin-top:0; min-width:0; }
    .organizer-layout #organizerViewer { grid-area:viewer; margin-top:0; min-width:0; min-height:620px; height:100%; display:flex; flex-direction:column; }
    .organizer-layout #pageGrid { flex:1; grid-template-columns:repeat(auto-fill,minmax(175px,1fr)); align-content:start; max-height:calc(100vh - 245px); min-height:500px; gap:16px; padding:18px; }
    .organizer-layout .page-thumb { padding:9px; }
    .organizer-layout .page-thumb .thumb-image-frame { height:245px; }
    .organizer-layout .page-thumb img { height:100%; }
    .organizer-layout .page-thumb .page-label { font-size:12px; }
    .organizer-layout .actions { grid-area:actions; margin-top:0; }
    .organizer-layout .status { grid-area:status; margin-top:0; }


    .drop-zone { border: 2px dashed #cbd5e1; border-radius: 14px; min-height: 180px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px 16px; background: #fafbfc; transition: all 0.25s; cursor: pointer; }
    .drop-zone.drag-over { border-color: #4f46e5; background: #eef2ff; }
    .drop-zone .icon { font-size: 36px; display: block; margin-bottom: 6px; }
    .drop-zone h3 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
    .drop-zone p { color: #64748b; font-size: 13px; margin-bottom: 12px; }
    .drop-zone .choose { display: inline-flex; background: #4f46e5; color: #fff; padding: 8px 18px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: background 0.2s; border: none; }
    .drop-zone .choose:hover { background: #4338ca; }
    .drop-zone input[type="file"] { display: none; }

    .image-options { margin-top: 14px; display: none; flex-direction: column; gap: 12px; padding: 14px 16px; background: #f8fafc; border-radius: 10px; border: 1px solid #e2e8f0; }
    .image-options.visible { display: flex; }
    .option-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .option-row label { font-weight: 600; font-size: 13px; color: #334155; min-width: 80px; }
    .option-row input[type="number"], .option-row input[type="text"] { width: 80px; padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 13px; font-family: inherit; }
    .option-row select { padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 13px; font-family: inherit; background: #fff; }
    .option-row .checkbox-group { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #334155; }
    .option-row .checkbox-group input[type="checkbox"] { width: 16px; height: 16px; accent-color: #4f46e5; }
    .quality-slider, .compress-slider { display: flex; align-items: center; gap: 10px; }
    .quality-slider input[type="range"], .compress-slider input[type="range"] { width: 120px; accent-color: #4f46e5; }
    .quality-slider span, .compress-slider span { font-weight: 600; font-size: 14px; min-width: 30px; }

    .files { margin-top: 14px; display: grid; gap: 6px; }
    .file-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 13px; }
    .file-item .name { font-weight: 500; color: #0f172a; word-break: break-word; }
    .file-item .size { color: #64748b; font-size: 12px; margin-left: 8px; white-space: nowrap; }

    .organizer-viewer { display:none; margin-top:16px; border:1px solid #dbe3ef; border-radius:12px; overflow:hidden; background:#f8fafc; }
    .organizer-viewer.visible { display:block; }
    .viewer-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; background:#eef2f7; border-bottom:1px solid #dbe3ef; flex-wrap:wrap; }
    .viewer-head strong { font-size:14px; }
    .viewer-head span { color:#64748b; font-size:12px; }
    .page-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(125px,1fr)); gap:12px; padding:14px; max-height:560px; overflow:auto; }
    .page-thumb { position:relative; border:2px solid #dbe3ef; border-radius:8px; padding:7px; background:#fff; cursor:pointer; min-width:0; text-align:left; }
    .page-thumb .thumb-image-frame { display:flex; align-items:center; justify-content:center; width:100%; height:150px; overflow:hidden; background:#e2e8f0; }
    .page-thumb img { display:block; width:100%; height:100%; object-fit:contain; transform-origin:center center; transition:transform .18s ease; }
    .page-thumb img.rotate-quarter { transform:rotate(var(--preview-rotation)) scale(var(--preview-scale, .72)); }
    .range-error { width:100%; color:#b91c1c; font-size:12px; font-weight:600; display:none; }
    .page-thumb img.rotate-half { transform:rotate(180deg); }
    .page-thumb .page-label { display:flex; justify-content:space-between; gap:4px; margin-top:6px; font-size:11px; color:#475569; }
    .page-thumb.selected { border-color:#4f46e5; background:#eef2ff; box-shadow:0 0 0 1px #4f46e5; }
    .page-thumb.dragging { opacity:.4; }
    .page-thumb .selection-mark { position:absolute; top:9px; right:9px; background:#4f46e5; color:white; border-radius:50%; width:20px; height:20px; display:none; align-items:center; justify-content:center; font-size:12px; }
    .page-thumb.selected .selection-mark { display:flex; }
    .viewer-help { padding:0 14px 12px; color:#64748b; font-size:12px; }
    .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    .convert-btn { background: #4f46e5; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-weight: 700; font-size: 14px; cursor: pointer; transition: background 0.2s; font-family: inherit; }
    .convert-btn:hover { background: #4338ca; }
    .convert-btn:disabled { opacity: 0.5; pointer-events: none; }

    .status { margin-top: 14px; padding: 10px 14px; border-radius: 8px; background: #f8fafc; color: #475569; font-size: 13px; display: none; }
    .status.show { display: block; }
    .status.error { background: #fef2f2; color: #b91c1c; }
    .status.ok { background: #f0fdf4; color: #166534; }

    @media (max-width: 768px) {
      .header { padding: 0 12px; gap: 10px; flex-wrap: wrap; height: auto; min-height: 56px; }
      .brand { font-size: 18px; }
      .nav { margin-left: 0; width: 100%; justify-content: flex-start; overflow-x: auto; gap: 2px; flex-wrap: nowrap; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
      .nav button { font-size: 13px; padding: 6px 12px; }
      .wrap { padding: 12px 8px; }
      .converter-card { padding: 14px 12px; border-radius: 12px; }
      .option-row { flex-direction: column; align-items: stretch; gap: 6px; }
      .quality-slider input[type="range"], .compress-slider input[type="range"] { width: 100%; }
      .convert-btn { width: 100%; justify-content: center; padding: 10px 16px; font-size: 13px; }
      .actions { justify-content: stretch; }
      .panel.active.organizer-layout { display:flex; flex-direction:column; gap:12px; }
      .organizer-layout #drop, .organizer-layout #imageOptions, .organizer-layout #pdfOptions, .organizer-layout #fileList, .organizer-layout #organizerViewer, .organizer-layout .actions, .organizer-layout .status { width:100%; }
      .organizer-layout #organizerViewer { min-height:0; }
      .organizer-layout #pageGrid { grid-template-columns:repeat(auto-fill,minmax(135px,1fr)); max-height:65vh; min-height:220px; padding:12px; gap:10px; }
      .organizer-layout .page-thumb img { height:190px; }
    }
  </style>
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    /* Opened for one tool (from the home page): show only that tool. */
    html.single-tool .tabs-wrapper { display: none !important; }
    html.embedded .header { display: none !important; }
    .tool-head { margin: 0 0 16px; }
    .tool-head h2 { margin: 0; font-size: 22px; letter-spacing: -.3px; }
    .tool-head p { margin: 4px 0 0; color: #64748b; font-size: 14px; }
    html.single-tool #organizerViewer:not(.visible) { display: none !important; }
  </style>
  <script>
    (() => {
      const tool = new URLSearchParams(location.search).get('tool');
      if (tool) document.documentElement.classList.add('single-tool');
      if (window.top !== window) document.documentElement.classList.add('embedded');
    })();
  </script>
</head>
<body>
  <header class="header">
    <div class="brand"><span class="brand-icon">▣</span> Document Converter</div>
    <nav class="nav">
      <button class="active">Converter</button>
      <button onclick="location.href='/'">⬅ Back to Home</button>
    </nav>
  </header>

  <div class="wrap">
    <section class="converter-card">
      <div class="tool-head" id="toolHead" hidden><h2 id="toolName"></h2><p id="toolDesc"></p></div>
      <div class="tabs-wrapper">
        <div class="tabs" id="tabsContainer">
          <button class="tab active" data-conversion="word-to-pdf">Word → PDF</button>
          <button class="tab" data-conversion="pdf-to-word">PDF → Word</button>
          <button class="tab" data-conversion="excel-to-pdf">Excel → PDF</button>
          <button class="tab" data-conversion="powerpoint-to-pdf">PowerPoint → PDF</button>
          <button class="tab" data-conversion="images-to-pdf">Images → PDF</button>
          <button class="tab" data-conversion="pdf-to-images">PDF → Images</button>
          <button class="tab" data-conversion="merge-pdf">Merge PDFs</button>
          <button class="tab" data-conversion="compress-pdf">Compress PDF</button>
          <button class="tab" data-conversion="split-pdf">Split PDF</button>
          <button class="tab" data-conversion="rotate-pdf">Rotate Pages</button>
          <button class="tab" data-conversion="reorder-pdf">Reorder Pages</button>
          <button class="tab" data-conversion="image-to-image">Image → Image</button>
        </div>
      </div>

      <div id="panel" class="panel active">
        <div class="drop-zone" id="drop">
          <div>
            <span class="icon">📤</span>
            <h3 id="dropTitle">Upload an image</h3>
            <p id="dropHint">PNG, JPG, JPEG, WebP, BMP, GIF or TIFF • up to 50 MB</p>
            <label class="choose">Choose file <input id="files" type="file"></label>
          </div>
        </div>

        <div class="image-options" id="imageOptions">
          <div class="option-row">
            <label for="targetFormat">Format:</label>
            <select id="targetFormat">
              <option value="jpeg">JPEG</option>
              <option value="png">PNG</option>
              <option value="webp">WebP</option>
              <option value="bmp">BMP</option>
              <option value="gif">GIF</option>
              <option value="tiff">TIFF</option>
            </select>
          </div>
          <div class="option-row" id="qualityRow" style="display: none;">
            <label>Quality:</label>
            <div class="quality-slider">
              <input type="range" id="quality" min="1" max="100" value="85">
              <span id="qualityValue">85</span>
            </div>
          </div>
          <div class="option-row" id="compressRow" style="display: none;">
            <label>Compression:</label>
            <div class="compress-slider">
              <input type="range" id="compressLevel" min="0" max="9" value="6">
              <span id="compressValue">6</span>
            </div>
          </div>
          <div class="option-row">
            <label>Resize:</label>
            <select id="resizeMode">
              <option value="none">No resize</option>
              <option value="percentage">Scale by %</option>
              <option value="custom">Custom width/height</option>
            </select>
          </div>
          <div class="option-row" id="percentageRow" style="display: none;">
            <label>Percentage:</label>
            <input type="number" id="scalePercent" value="50" min="1" max="500" style="width:80px;"> %
          </div>
          <div class="option-row" id="customSizeRow" style="display: none;">
            <label>Width:</label>
            <input type="number" id="customWidth" value="800" min="1" style="width:80px;">
            <label>Height:</label>
            <input type="number" id="customHeight" value="600" min="1" style="width:80px;">
            <div class="checkbox-group">
              <input type="checkbox" id="keepAspect" checked>
              <label for="keepAspect">Maintain aspect ratio</label>
            </div>
          </div>
        </div>

        <div class="image-options" id="pdfOptions" style="display:none;"></div>
        <div class="files" id="fileList"></div>
        <section class="organizer-viewer" id="organizerViewer" aria-live="polite">
          <div class="viewer-head"><strong id="viewerTitle">Uploaded document preview</strong><span id="viewerSummary"></span></div>
          <div class="page-grid" id="pageGrid"></div>
          <div class="viewer-help" id="viewerHelp">Select pages to see exactly which pages will be affected.</div>
        </section>
        <div class="actions"><button class="convert-btn" id="convertBtn" disabled>Convert</button></div>
        <div class="status" id="status"></div>
      </div>
    </section>
  </div>

  <script>
    // Check if a specific tool was requested from the Home grid
    const urlParams = new URLSearchParams(window.location.search);
    const requestedTool = urlParams.get('tool');
    let conversion = (requestedTool && Object.prototype.hasOwnProperty.call(specs0(), requestedTool)) ? requestedTool : 'word-to-pdf', selectedFiles = [], previewFiles = [], draggedPage = null, originalOrder = null;
    function specs0() { return {'word-to-pdf':1,'pdf-to-word':1,'excel-to-pdf':1,'powerpoint-to-pdf':1,'images-to-pdf':1,'pdf-to-images':1,'merge-pdf':1,'compress-pdf':1,'split-pdf':1,'rotate-pdf':1,'reorder-pdf':1,'image-to-image':1}; }
    
    const $ = id => document.getElementById(id);
    const specs = {
      'word-to-pdf': { title: 'Upload a Word document', hint: 'DOC, DOCX or ODT • up to 50 MB', accept: '.doc,.docx,.odt', multiple: false, button: 'Convert to PDF', showOptions: false },
      'pdf-to-word': { title: 'Upload a PDF', hint: 'One PDF • text will be extracted into a Word document', accept: '.pdf', multiple: false, button: 'Convert to Word', showOptions: false },
      'excel-to-pdf': { title: 'Upload an Excel workbook', hint: 'XLS, XLSX or ODS • up to 50 MB', accept: '.xls,.xlsx,.ods', multiple: false, button: 'Convert to PDF', showOptions: false },
      'powerpoint-to-pdf': { title: 'Upload a PowerPoint presentation', hint: 'PPT, PPTX or ODP • up to 50 MB', accept: '.ppt,.pptx,.odp', multiple: false, button: 'Convert to PDF', showOptions: false },
      'images-to-pdf': { title: 'Upload images', hint: 'PNG, JPG, JPEG or WebP • multiple files allowed', accept: '.png,.jpg,.jpeg,.webp', multiple: true, button: 'Create PDF', showOptions: false },
      'pdf-to-images': { title: 'Upload a PDF', hint: 'One PDF • pages are exported as PNG images (ZIP archive)', accept: '.pdf', multiple: false, button: 'Convert to Images', showOptions: false },
      'merge-pdf': { title: 'Upload PDFs to merge', hint: 'Select two or more PDF files', accept: '.pdf', multiple: true, button: 'Merge PDFs', showOptions: false },
      'compress-pdf': { title: 'Upload a PDF to compress', hint: 'One PDF • optimize embedded streams, images and fonts', accept: '.pdf', multiple: false, button: 'Compress PDF', showOptions: false },
      'split-pdf': { title: 'Upload a PDF to split', hint: 'One PDF • each comma-separated range becomes a separate PDF in a ZIP', accept: '.pdf', multiple: false, button: 'Split PDF', showOptions: false },
      'rotate-pdf': { title: 'Upload a PDF to rotate', hint: 'One PDF • rotate all pages or selected pages', accept: '.pdf', multiple: false, button: 'Rotate Pages', showOptions: false },
      'reorder-pdf': { title: 'Upload a PDF to reorder', hint: 'One PDF • enter every page number exactly once in the desired order', accept: '.pdf', multiple: false, button: 'Reorder Pages', showOptions: false },
      'image-to-image': { title: 'Upload an image', hint: 'PNG, JPG, JPEG, WebP, BMP, GIF or TIFF', accept: '.png,.jpg,.jpeg,.webp,.bmp,.gif,.tiff', multiple: false, button: 'Convert Image', showOptions: true }
    };

    function setStatus(text, type = '') {
      const s = $('status');
      s.textContent = text;
      s.className = text ? 'status show ' + type : 'status';
    }

    function renderFiles() {
      const list = $('fileList');
      list.innerHTML = '';
      selectedFiles.forEach(f => {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `<span class="name">${escapeHtml(f.name)}</span><span class="size">${(f.size / 1024 / 1024).toFixed(2)} MB</span>`;
        list.appendChild(div);
      });
      $('convertBtn').disabled = selectedFiles.length === 0;
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    function toggleResizeOptions() {
      const mode = $('resizeMode').value;
      $('percentageRow').style.display = mode === 'percentage' ? 'flex' : 'none';
      $('customSizeRow').style.display = mode === 'custom' ? 'flex' : 'none';
    }

    function updateFormatSliders() {
      const format = $('targetFormat').value;
      const qualityRow = $('qualityRow');
      const compressRow = $('compressRow');
      if (format === 'jpeg' || format === 'webp' || format === 'gif') {
        qualityRow.style.display = 'flex'; compressRow.style.display = 'none';
      } else if (format === 'png') {
        qualityRow.style.display = 'none'; compressRow.style.display = 'flex';
      } else {
        qualityRow.style.display = 'none'; compressRow.style.display = 'none';
      }
    }

    function configure() {
      const s = specs[conversion];
      $('panel').classList.toggle('organizer-layout', organizerTools.has(conversion));
      if (!s) return;
      $('dropTitle').textContent = s.title;
      $('dropHint').textContent = s.hint;
      $('files').accept = s.accept;
      $('files').multiple = s.multiple;
      $('convertBtn').textContent = s.button;
      const opt = $('imageOptions');
      if (s.showOptions) { opt.classList.add('visible'); updateFormatSliders(); }
      else { opt.classList.remove('visible'); }
      const pdfOpt = $('pdfOptions');
      const pdfOptionMarkup = {
        'split-pdf': '<div class="option-row"><label for="pageRanges">Page ranges:</label><input id="pageRanges" type="text" placeholder="e.g. 1-3,5,8-10" style="width:min(360px,100%);"><span style="font-size:12px;color:#64748b;">Each item becomes a separate PDF in a ZIP.</span></div>',
        'rotate-pdf': '<div class="option-row"><label for="rotation">Rotation:</label><select id="rotation"><option value="90">90° clockwise</option><option value="180">180°</option><option value="270">270° clockwise</option></select><label for="pageRanges">Pages:</label><input id="pageRanges" type="text" value="all" placeholder="all or 1-3,5" style="width:180px;"></div>',
        'reorder-pdf': '<div class="option-row"><label for="pageOrder">New page order:</label><input id="pageOrder" type="text" placeholder="e.g. 3,1,2,4" style="width:min(360px,100%);"><span style="font-size:12px;color:#64748b;">Include every page exactly once.</span></div>'
      };
      pdfOpt.innerHTML = pdfOptionMarkup[conversion] || '';
      pdfOpt.style.display = pdfOpt.innerHTML ? 'flex' : 'none';
      selectedFiles = []; previewFiles = []; $('organizerViewer').classList.remove('visible'); $('pageGrid').innerHTML = '';
      renderFiles();
      setStatus('');
      toggleResizeOptions();
    }

    // Opened for a single tool: name it and hide the other converters.
    const TOOL_NAMES = {
      'word-to-pdf': ['📄 Word to PDF', 'Convert DOC and DOCX files to PDF.'],
      'pdf-to-word': ['📝 PDF to Word', 'Turn a PDF into an editable Word document.'],
      'excel-to-pdf': ['📊 Excel to PDF', 'Convert spreadsheets to PDF.'],
      'powerpoint-to-pdf': ['📽️ PowerPoint to PDF', 'Convert presentations to PDF.'],
      'images-to-pdf': ['🖼️ Images to PDF', 'Combine photos and images into one PDF.'],
      'pdf-to-images': ['📸 PDF to Images', 'Save each PDF page as an image.'],
      'merge-pdf': ['🔗 Merge PDFs', 'Combine several PDFs into one file.'],
      'compress-pdf': ['🗜️ Compress PDF', 'Make a PDF smaller to share or email.'],
      'split-pdf': ['✂️ Split PDF', 'Pull page ranges out into separate PDFs.'],
      'rotate-pdf': ['🔄 Rotate Pages', 'Turn all pages or just the ones you pick.'],
      'reorder-pdf': ['↕️ Reorder Pages', 'Change the order of the pages.'],
      'image-to-image': ['🔄 Image to Image', 'Convert an image to another format.'],
    };
    if (requestedTool && TOOL_NAMES[conversion]) {
      $('toolName').textContent = TOOL_NAMES[conversion][0];
      $('toolDesc').textContent = TOOL_NAMES[conversion][1];
      $('toolHead').hidden = false;
      document.title = TOOL_NAMES[conversion][0].replace(/^\S+\s/, '') + ' · PDF Suite';
    }

    // Set active tab based on URL parameter
    document.querySelectorAll('.tab').forEach(b => {
      if (b.dataset.conversion === conversion) {
        b.classList.add('active');
      } else {
        b.classList.remove('active');
      }
      b.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        conversion = b.dataset.conversion;
        configure();
      });
    });

    const organizerTools = new Set(['merge-pdf','compress-pdf','split-pdf','rotate-pdf','reorder-pdf']);
    async function loadOrganizerPreview() {
      if (!organizerTools.has(conversion) || !selectedFiles.length) {
        $('organizerViewer').classList.remove('visible'); previewFiles = []; return;
      }
      $('organizerViewer').classList.add('visible'); $('viewerTitle').textContent = 'Preparing document preview…';
      $('viewerSummary').textContent = ''; $('pageGrid').innerHTML = '';
      try {
        const form = new FormData(); selectedFiles.forEach(f => form.append('files', f));
        const res = await fetch('/api/pdf-preview', {method:'POST', body:form});
        const data = await res.json(); if (!res.ok) throw new Error(data.error || 'Preview failed.');
        previewFiles = data.files || []; originalOrder = null; renderPageGrid();
        if (data.truncated) $('viewerHelp').textContent = `Showing the first ${previewFiles.reduce((n,f)=>n+f.pages.length,0)} of ${data.totalPages} pages. The operation still applies to the whole document.`;
      } catch (err) { $('viewerTitle').textContent = 'Preview unavailable'; $('viewerHelp').textContent = err.message; }
    }
    function renderPageGrid() {
      const grid = $('pageGrid'); grid.innerHTML = '';
      const allPages = previewFiles.flatMap((file, fi) => file.pages.map(page => ({...page, fileIndex:fi, fileName:file.fileName})));
      $('viewerTitle').textContent = conversion === 'merge-pdf' ? 'PDFs to be merged' : 'Uploaded document preview';
      $('viewerSummary').textContent = `${previewFiles.length} file(s) · ${allPages.length} page(s)`;
      $('viewerHelp').textContent = conversion === 'reorder-pdf' ? 'Drag pages to reorder them. The page order field updates automatically.' :
        conversion === 'rotate-pdf' || conversion === 'split-pdf' ? 'Click page thumbnails to select the pages. Leave all unselected to apply the operation to all pages.' :
        conversion === 'merge-pdf' ? 'Review the uploaded files and page order before merging.' : 'Review the uploaded PDF pages before compressing.';
      allPages.forEach((page, index) => {
        const card = document.createElement('button'); card.type='button'; card.className='page-thumb'; card.draggable = conversion === 'reorder-pdf';
        card.dataset.index = index; card.dataset.page = page.page; card.innerHTML = `<span class="selection-mark">✓</span><span class="thumb-image-frame"><img alt="Page ${page.page}" src="${page.thumbnail}"></span><span class="page-label"><span>${escapeHtml(page.fileName)}</span><b>Page ${page.page}</b></span>`;
        if (conversion === 'split-pdf' || conversion === 'rotate-pdf') {
          card.addEventListener('click', () => { card.classList.toggle('selected'); syncSelectedPages(); validatePageField(); applyRotationPreview(); });
        }
        if (conversion === 'reorder-pdf') {
          card.addEventListener('dragstart', () => { draggedPage=index; card.classList.add('dragging'); });
          card.addEventListener('dragend', () => { card.classList.remove('dragging'); draggedPage=null; });
          card.addEventListener('dragover', e => e.preventDefault());
          card.addEventListener('drop', e => { e.preventDefault(); const target=Number(card.dataset.index); if(draggedPage===null || target===draggedPage)return; const flat=previewFiles.flatMap(f=>f.pages.map(p=>({...p,originalPage:p.originalPage || p.page,fileName:f.fileName}))); const moved=flat.splice(draggedPage,1)[0]; flat.splice(target,0,moved); previewFiles=[{fileName:selectedFiles[0].name,pages:flat.map((p,i)=>({...p,page:p.originalPage,displayPosition:i+1,fileIndex:0}))}]; renderPageGrid(); $('pageOrder').value=flat.map(p=>p.originalPage || p.page).join(','); });
        }
        grid.appendChild(card);
        card.querySelector('img').addEventListener('load', applyRotationPreview, { once: true });
      });
      if (conversion === 'reorder-pdf' && $('pageOrder') && !originalOrder) { originalOrder = allPages.map(p=>p.originalPage || p.page).join(','); $('pageOrder').value = originalOrder; }
      applyRotationPreview();
    }
    function syncSelectedPages() {
      const selected=[...$('pageGrid').querySelectorAll('.page-thumb.selected')].map(el=>Number(el.dataset.index)+1);
      const field=$('pageRanges'); if(field) field.value=selected.length ? selected.join(',') : (conversion==='rotate-pdf' ? 'all' : '');
    }

    // Page ranges are parsed with exactly the same rules as the server (converter.py
    // _parse_page_ranges), so the live preview never disagrees with the real result.
    function parsePageRanges(value, pageCount) {
      const raw=(value || '').trim().toLowerCase();
      if (!raw) return { error: 'Enter at least one page number or range, e.g. 1-3,5.' };
      const groups=[];
      for (const piece of raw.split(',')) {
        const part=piece.trim();
        if (!part) return { error: 'Page ranges contain an empty item.' };
        if (part.includes('-')) {
          const bits=part.split('-').map(x=>x.trim());
          if (bits.length !== 2 || !bits.every(x=>/^\d+$/.test(x))) return { error: `Invalid page range: ${part}` };
          const start=Number(bits[0]), end=Number(bits[1]);
          if (end < start) return { error: `Page range ${part} goes backwards. Write it as ${end}-${start}.` };
          if (start < 1 || end > pageCount) return { error: `Page range ${part} is outside 1-${pageCount}.` };
          const g=[]; for (let n=start; n<=end; n++) g.push(n); groups.push(g);
        } else {
          if (!/^\d+$/.test(part)) return { error: `Invalid page number: ${part}` };
          const page=Number(part);
          if (page < 1 || page > pageCount) return { error: `Page ${page} is outside 1-${pageCount}.` };
          groups.push([page]);
        }
      }
      return { groups };
    }
    function totalPreviewPages() { return previewFiles.reduce((sum,file)=>sum+(file.pageCount || file.pages.length),0); }
    function validatePageField() {
      if (conversion !== 'rotate-pdf' && conversion !== 'split-pdf') return true;
      const field=$('pageRanges'); if (!field || !previewFiles.length) return true;
      const value=field.value.trim().toLowerCase();
      if (conversion === 'rotate-pdf' && (value === '' || value === 'all')) { setRangeError(''); return true; }
      if (conversion === 'split-pdf' && !value) { setRangeError(''); return true; }
      const parsed=parsePageRanges(value, totalPreviewPages());
      setRangeError(parsed.error || ''); return !parsed.error;
    }
    function setRangeError(message) {
      let el=$('rangeError');
      if (!el) { el=document.createElement('div'); el.id='rangeError'; el.className='range-error'; $('pdfOptions').appendChild(el); }
      el.textContent=message; el.style.display=message ? 'block' : 'none';
      $('convertBtn').disabled = selectedFiles.length === 0 || !!message;
    }
    function applyRotationPreview() {
      if (conversion !== 'rotate-pdf') return;
      const rotation=Number($('rotation')?.value || 0);
      const range=($('pageRanges')?.value || 'all').trim().toLowerCase();
      let chosen=null;
      if (range && range !== 'all') {
        const parsed=parsePageRanges(range, totalPreviewPages());
        // Invalid input: show no rotation at all (the server would reject it too).
        chosen=new Set(parsed.error ? [] : parsed.groups.flat());
      }
      document.querySelectorAll('#pageGrid .page-thumb').forEach((card,index)=>{
        const img=card.querySelector('img'); if (!img) return;
        const shouldRotate=!chosen || chosen.has(index+1);
        img.classList.remove('rotate-quarter','rotate-half');
        img.style.removeProperty('--preview-rotation');
        if (!shouldRotate || !rotation) return;
        if (rotation===180) img.classList.add('rotate-half');
        else {
          // Fit the turned page inside its frame instead of a fixed shrink factor.
          const frame=img.parentElement, W=frame.clientWidth, H=frame.clientHeight, nw=img.naturalWidth || 1, nh=img.naturalHeight || 1;
          const c=Math.min(W/nw, H/nh), cw=nw*c, ch=nh*c, scale=Math.min(W/ch, H/cw, 1.4);
          img.classList.add('rotate-quarter'); img.style.setProperty('--preview-rotation', `${rotation}deg`); img.style.setProperty('--preview-scale', String(scale || 0.72));
        }
      });
    }
    // pdfOptions is rebuilt when switching tools, so delegate events from its stable parent.
    $('pdfOptions').addEventListener('input', e => { if (e.target.id==='pageRanges') { validatePageField(); applyRotationPreview(); } });
    $('pdfOptions').addEventListener('change', e => { if (e.target.id==='rotation' || e.target.id==='pageRanges') { validatePageField(); applyRotationPreview(); } });
    $('files').addEventListener('change', e => { selectedFiles = [...e.target.files]; renderFiles(); loadOrganizerPreview(); });

    const drop = $('drop');
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag-over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
    drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('drag-over'); selectedFiles = [...e.dataTransfer.files]; renderFiles(); loadOrganizerPreview(); });

    $('quality').addEventListener('input', function() { $('qualityValue').textContent = this.value; });
    $('compressLevel').addEventListener('input', function() { $('compressValue').textContent = this.value; });
    $('targetFormat').addEventListener('change', updateFormatSliders);
    $('resizeMode').addEventListener('change', toggleResizeOptions);

    $('convertBtn').addEventListener('click', async () => {
      const s = specs[conversion];
      if (!selectedFiles.length) return;
      if (conversion === 'merge-pdf' && selectedFiles.length < 2) { setStatus('Select at least two PDFs.', 'error'); return; }
      if (conversion === 'split-pdf' && !$('pageRanges').value.trim()) { setStatus('Enter page ranges, e.g. 1-3,5.', 'error'); return; }
      if (!validatePageField()) { setStatus($('rangeError').textContent, 'error'); return; }
      if (conversion === 'reorder-pdf' && !$('pageOrder').value.trim()) { setStatus('Enter the new page order, e.g. 3,1,2.', 'error'); return; }
      const form = new FormData();
      form.append('conversion', conversion);
      selectedFiles.forEach(f => form.append('files', f));

      if (conversion === 'image-to-image') {
        form.append('target_format', $('targetFormat').value);
        if ($('qualityRow').style.display !== 'none') form.append('quality', $('quality').value);
        if ($('compressRow').style.display !== 'none') form.append('compress_level', $('compressLevel').value);
        form.append('resize_mode', $('resizeMode').value);
        if ($('resizeMode').value === 'percentage') form.append('scale_percent', $('scalePercent').value);
        else if ($('resizeMode').value === 'custom') {
          form.append('width', $('customWidth').value);
          form.append('height', $('customHeight').value);
          form.append('keep_aspect', $('keepAspect').checked ? 'true' : 'false');
        }
      }
      if (conversion === 'split-pdf' || conversion === 'rotate-pdf') form.append('page_ranges', $('pageRanges').value);
      if (conversion === 'rotate-pdf') form.append('rotation', $('rotation').value);
      if (conversion === 'reorder-pdf') form.append('page_order', $('pageOrder').value);

      const btn = $('convertBtn');
      btn.disabled = true; setStatus('Converting…');
      try {
        const res = await fetch('/api/convert', { method: 'POST', body: form });
        if (!res.ok) { let msg = 'Conversion failed.'; try { msg = (await res.json()).error || msg; } catch {} throw new Error(msg); }
        const blob = await res.blob(); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url;
        let filename = 'converted';
        if (conversion === 'pdf-to-images') filename = 'images.zip';
        else if (conversion === 'pdf-to-word') filename = 'converted.docx';
        else if (conversion === 'merge-pdf') filename = 'merged.pdf';
        else if (conversion === 'compress-pdf') filename = 'compressed.pdf';
        else if (conversion === 'split-pdf') filename = 'split_pdfs.zip';
        else if (conversion === 'rotate-pdf') filename = 'rotated.pdf';
        else if (conversion === 'reorder-pdf') filename = 'reordered.pdf';
        else if (conversion === 'image-to-image') { const ext = $('targetFormat').value; filename = `converted.${ext === 'jpeg' ? 'jpg' : ext}`; }
        else { filename = 'converted.pdf'; }
        a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
        setStatus('Conversion completed. Download started.', 'ok');
      } catch (err) {
        setStatus(err.message, 'error');
      } finally {
        btn.disabled = false; renderFiles(); validatePageField();
      }
    });

    // Initial setup
    configure();
  </script>
</body>
</html>
