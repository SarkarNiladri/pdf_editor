# fly.toml app configuration file generated for pdf-editor-6vcbdw
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pdf-editor-6vcbdw'
primary_region = 'sin'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1