<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b4cf0">
  <title>Offline – PDF Suite</title>
  <link rel="icon" href="/static/icons/favicon-32.png" type="image/png">
  <style>
    *{box-sizing:border-box;margin:0}
    body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f5f6fb;color:#0f172a;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
    img{width:72px;height:72px;margin-bottom:18px}
    h1{font-size:22px;letter-spacing:-.4px;margin-bottom:8px}
    p{color:#64748b;font-size:15px;line-height:1.5;max-width:340px;margin:0 auto 20px}
    button{border:0;border-radius:999px;padding:12px 22px;min-height:44px;font:inherit;font-weight:650;color:#fff;background:linear-gradient(135deg,#5b4cf0,#8b5cf6);cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/static/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>This page hasn't been saved on this device yet. Connect to the internet and try again. Pages you've opened before work offline.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
