# Render blueprint. Render's native Python runtime has no root access, so
# `apt-get install libreoffice` cannot run there; build the same Docker image
# that Fly.io uses instead.
services:
  - type: web
    name: pdf-editor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: PORT
        value: "8080"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_RATE_LIMIT_PER_HOUR
        value: "20"
    autoDeploy: true
    healthCheckPath: /
