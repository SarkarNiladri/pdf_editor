services:
  - type: web
    name: pdf-editor
    env: python
    pythonVersion: 3.11
    plan: starter
    
    # Build command - installs LibreOffice first, then Python packages
    buildCommand: apt-get update && apt-get install -y libreoffice libreoffice-writer libmupdf-dev && pip install -r requirements.txt
    
    # Start command - runs Gunicorn with 4 workers
    startCommand: gunicorn -w 4 -b 0.0.0.0:10000 --timeout 120 --access-logfile - --error-logfile - app:app
    
    # Environment variables for production
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: PYTHONUNBUFFERED
        value: "1"
    
    # Auto-deploy on git push
    autoDeploy: true
    
    # Health check
    healthCheckPath: /