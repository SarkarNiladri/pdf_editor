services:
  - type: web
    name: pdf-editor
    env: python
    pythonVersion: 3.11
    plan: starter
    
    # Build command installs LibreOffice first
    buildCommand: apt-get update && apt-get install -y libreoffice libreoffice-writer && pip install -r requirements.txt
    
    # Start command uses Gunicorn
    startCommand: gunicorn -w 4 -b 0.0.0.0:10000 --timeout 120 app:app
    
    # Environment variables
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: PYTHONUNBUFFERED
        value: "1"
    
    # Auto-deploy on push
    autoDeploy: true


# SETUP INSTRUCTIONS:
# 1. Create this file as 'render.yaml' in your project root
# 2. Commit and push to GitHub
# 3. Render will auto-detect and use this configuration
# 4. LibreOffice will be installed during the build
#
# Benefits:
# - No need to manually configure in Render dashboard
# - All settings tracked in git
# - Easy to reproduce
# - Consistent across team members